name: VeritasQuant CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # 推送容器镜像到 ghcr.io（GitHub Packages）

# ---------------------------------------------------------------------------
# 全局版本常量：包版本号唯一来源。
# 升级版本时只改这里，wheel/sdist 文件名引用会自动同步。
# 与 pyproject.toml [project].version 保持一致。
# ---------------------------------------------------------------------------
env:
  VQ_VERSION: "0.1.2"

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Requirements/Runtime.lock -r Requirements/Development.lock
          python3 -m pip install -e .
      - name: Validate dependency locks and repository conventions
        run: |
          python3 scripts/VerifyDependencyLocks.py
          python3 scripts/Preflight.py
      - name: Run static checks
        run: |
          python3 -m ruff check src tests scripts
          python3 -m mypy src scripts
      - name: Run unit and contract tests with reports
        run: |
          python3 -m coverage run -m pytest tests/unit tests/contract tests/packaging --junitxml artifacts/JUnit.xml
          python3 -m coverage xml -o artifacts/Coverage.xml
      - name: Build distribution packages
        run: python3 -m build
      - name: Verify repository-external wheel installation
        run: python3 scripts/VerifyPackage.py --wheel dist/veritasquant-${{ env.VQ_VERSION }}-py3-none-any.whl
      - name: Collect test evidence
        run: python3 scripts/CollectTestEvidence.py --junit artifacts/JUnit.xml --coverage artifacts/Coverage.xml --artifact dist/veritasquant-${{ env.VQ_VERSION }}-py3-none-any.whl --artifact dist/veritasquant-${{ env.VQ_VERSION }}.tar.gz --work-item P0-006 --work-item P0-009 --output artifacts/TestEvidence.json
      - name: Upload quality evidence
        uses: actions/upload-artifact@v6
        with:
          name: quality-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            artifacts/
            dist/
          retention-days: 90

  security:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked audit dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Requirements/Runtime.lock -r Requirements/Development.lock
      - name: Scan repository for secrets
        run: python3 scripts/ScanSecrets.py
      - name: Audit runtime dependency vulnerabilities
        run: python3 -m pip_audit -r Requirements/Runtime.lock
      - name: Verify approved license baseline
        run: python3 scripts/VerifyLicenses.py --policy Configs/Security/LicensePolicy.yml

  database:
    name: Database migrations (P2-001)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: veritasquant
          POSTGRES_USER: veritasquant
          POSTGRES_PASSWORD: veritasquant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veritasquant -d veritasquant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 5s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked development dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Requirements/Runtime.lock -r Requirements/Development.lock
          python3 -m pip install -e .
      - name: Run database migration integration tests
        env:
          VQ_TEST_DATABASE_URL: postgresql://veritasquant:veritasquant@localhost:5432/veritasquant
        run: |
          python3 -m pytest tests/integration/database --junitxml artifacts/DatabaseJUnit.xml
      - name: Upload database test evidence
        uses: actions/upload-artifact@v6
        with:
          name: database-migration-evidence
          path: artifacts/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 服务端镜像构建并发布到 GitHub Container Registry（ghcr.io）。
  # - tag 推送（V*）→ 构建 <version> 与 latest 镜像（正式发布）；
  # - push 到 main/dev → 构建 latest（预发布）；
  # - workflow_dispatch → 手动构建（默认 latest）。
  # 认证使用 GitHub 内置 GITHUB_TOKEN（permissions.packages: write），无需外部凭据。
  # ---------------------------------------------------------------------------
  build-image:
    name: Build & publish server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker 镜像仓库名必须全小写；github.repository 可能是 ACANX/VeritasQuant。
      - name: Normalize lowercase image repository
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # dev 推送与手动触发时生成带版本前缀的 yyyyMMddHHmm 时间戳 tag（UTC），
      # 如 VQ_VERSION=0.1.2 → 0.1.2-202608031852（每次 dev 构建唯一可追溯）。
      - name: Generate timestamp tag for dev push and manual build
        id: timestamp
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
        run: |
          TS=$(date -u +%Y%m%d%H%M)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "tag=${{ env.VQ_VERSION }}-$TS" >> "$GITHUB_OUTPUT"
      # Git tag V* 触发时生成去 V 前缀的版本 tag（V0.1.2 → 0.1.2），
      # 与部署文档 VQ_IMAGE_TAG 语义一致（镜像 tag 不带 V）。
      # ⚠️ GitHub Actions 表达式不支持字符串切片（如 github.ref_name[1:]），
      #    必须用 shell 参数展开处理，否则 workflow 文件无效、CI 不运行。
      - name: Compute version tag without V prefix
        id: ver-tag
        if: startsWith(github.ref, 'refs/tags/V')
        shell: bash
        run: echo "stripped=${GITHUB_REF_NAME#V}" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            # dev 推送：0.1.2-<UTC时间戳>（每次 dev 构建唯一可追溯，不用 sha-*）
            type=raw,value=${{ steps.timestamp.outputs.tag }},enable=${{ github.ref == 'refs/heads/dev' }}
            # main 推送：0.1.2（版本 tag，指向发布线最新构建）
            type=raw,value=${{ env.VQ_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
            # V* Git tag：V0.1.2 + 去 V 版本 tag（0.1.2）
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/V') }}
            type=raw,value=${{ steps.ver-tag.outputs.stripped }},enable=${{ steps.ver-tag.outputs.stripped != '' }}
            # 手动触发：0.1.2-<UTC时间戳>
            type=raw,value=${{ steps.timestamp.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # 所有非 PR 构建发布 latest
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile
          # PR 验证构建但不上推送（PR 的 GITHUB_TOKEN 无 packages:write）；
          # push/tag 时推送 ghcr.io。
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image is pullable
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ steps.repo.outputs.image }}:latest"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '镜像已就绪: {{.RepoDigests}}'
