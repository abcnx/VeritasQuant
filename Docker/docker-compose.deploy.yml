# VeritasQuant 服务端部署编排（Windows 11 + Docker Desktop / WSL2）。
#
# 与 Docker/docker-compose.yml（临时开发依赖）不同：
# - 本编排包含应用服务端（API）、PostgreSQL 与 Redis，使用持久卷；
# - 供模拟盘（PAPER）与券商仿真（SIMULATION）实验使用；
# - 实盘交易默认禁用；任何实盘启用必须先走 Change 并满足 TechSpec 13 gate。
#
# 快速开始：
#   docker compose -f Docker/docker-compose.deploy.yml up --build --wait
#   （或使用 scripts/DeployServer.py 封装命令）
name: veritasquant

services:
  # ---------------------------------------------------------------------------
  # 应用服务端：API 服务（含 /health/live、/health/ready、业务 API）。
  # 默认以非 root 用户运行，仅暴露 18000。
  # ---------------------------------------------------------------------------
  server:
    # 默认拉取 GitHub Packages（ghcr.io）构建的镜像（由 CI build-image job 发布）。
    # 如需本地构建，取消下一行 build 块注释并改回 image: veritasquant/server:local。
    image: ghcr.io/${VQ_IMAGE_OWNER:-acanx}/veritasquant:${VQ_IMAGE_TAG:-latest}
    # build:
    #   context: ..
    #   dockerfile: Docker/Dockerfile
    container_name: vq-server
    environment:
      # 运行模式：PAPER（模拟盘）或 SIMULATION（券商仿真）。
      # 实盘 LIVE 默认禁用；显式设置也不得绕过运行门禁。
      VQ_ENVIRONMENT: ${VQ_ENVIRONMENT:-PAPER}
      # 服务端监听地址/端口（容器内固定 18000，宿主映射见 ports）。
      VQ_SERVER_HOST: 0.0.0.0
      VQ_SERVER_PORT: "18000"
      # 时间与日志：UTC 日志、上海时区便于本地观察。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${VQ_API_PORT:-18000}:18000"
    volumes:
      # 运行产物（回测输出、报告、日志落盘目录）。
      - vq-runtime:/opt/veritasquant/runtime
      # 数据导入目录（宿主侧挂载外部行情文件用，可自行调整路径）。
      - ${VQ_DATA_DIR:-./data}:/opt/veritasquant/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18000/health/live', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 最小权限：非 root（镜像内已切换），只读根文件系统 + 可写挂载点。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # PostgreSQL：事实/投影持久化（订单、成交、账户、审计等）。
  # 数据目录映射宿主 Windows 目录（D:\Dev\Docker\HostFileSystem\VeritasQuant\PostgreSQL），
  # 容器重建/删除不丢数据；目录不存在时首次启动自动初始化。
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:18-alpine
    container_name: vq-postgresql
    environment:
      POSTGRES_DB: veritasquant
      POSTGRES_USER: veritasquant
      # 密码通过宿主环境变量注入；未设置时拒绝启动（避免弱默认）。
      POSTGRES_PASSWORD: ${VQ_POSTGRES_PASSWORD:?必须设置 VQ_POSTGRES_PASSWORD 环境变量}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 数据目录映射宿主 Windows 目录（可经 VQ_POSTGRES_DATA_DIR 覆盖）。
      # ⚠️ PG18+ 镜像数据目录结构变更：挂载点为 /var/lib/postgresql（单一挂载），
      #    实际数据在宿主目录下的 18/ 子目录（如 .../PostgreSQL/18/）；
      #    挂载到 /var/lib/postgresql/data 会被镜像判定为 unused mount 并拒绝启动。
      # ⚠️ 大版本升级（16→18）时旧数据格式不兼容，需先 pg_dump 备份迁移。
      - ${VQ_POSTGRES_DATA_DIR:-D:/Dev/Docker/HostFileSystem/VeritasQuant/PostgreSQL}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritasquant -d veritasquant"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Redis：跨进程事件分发（Redis Streams）。
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: vq-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - vq-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  vq-runtime:
  vq-redis:
