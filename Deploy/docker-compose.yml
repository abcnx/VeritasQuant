# FinvQuant All-in-One 部署（Docker Compose）
#   - finvquant : 单镜像（Go 服务端 16001 + 内嵌前端 16002）
#   - postgres : PostgreSQL 18
#   - redis    : Redis 8
#
# 使用：cp Deploy/.env.example Deploy/.env && docker compose --env-file Deploy/.env up -d
# 镜像：ghcr.io/acanx/finvquant（docker pull 后直接部署）
#
# 项目名：顶层 name 固定为 finvquant（可用 FINV_PROJECT_NAME 自定义），
#    命名卷前缀随之变为 finvquant_（如 finvquant_finvquant-redisdata），不带 deploy 前缀。
#    切换项目名会导致命名卷不连续（Redis 数据在旧卷），注意数据迁移。

# 项目名（默认 finvquant；影响命名卷前缀，如 finvquant_finvquant-redisdata）
name: ${FINV_PROJECT_NAME:-finvquant}


services:
  finvquant:
    image: ghcr.io/acanx/finvquant:${FINV_IMAGE_TAG:-latest}
    build:
      # build context 指向仓库根目录（compose 位于 Deploy/ 子目录，上级即仓库根，Dockerfile 在此）
      context: ..
      dockerfile: Dockerfile
    container_name: ${FINV_CONTAINER_NAME:-finvquant}
    ports:
      - "16001:16001"   # 服务端 API
      - "16002:16002"   # 前端 Web
    environment:
      FINV_SERVER_HOST: "0.0.0.0"
      FINV_SERVER_PORT: "16001"
      FINV_WEB_PORT: "16002"
      FINV_PG_HOST: postgres
      FINV_PG_PORT: "5432"
      FINV_PG_USER: ${FINV_PG_USER:-finvquant}
      FINV_PG_PASSWORD: ${FINV_PG_PASSWORD:-finvquant}
      FINV_PG_DATABASE: ${FINV_PG_DATABASE:-finvquant}
      FINV_REDIS_ADDR: redis:6379
      FINV_REDIS_PASSWORD: ${FINV_REDIS_PASSWORD:-}
      FINV_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16001/API/V1/health/live >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    container_name: ${FINV_PG_CONTAINER_NAME:-fq-postgres}
    environment:
      POSTGRES_USER: ${FINV_PG_USER:-finvquant}
      POSTGRES_PASSWORD: ${FINV_PG_PASSWORD:-finvquant}
      POSTGRES_DB: ${FINV_PG_DATABASE:-finvquant}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # PG 端口暴露到宿主机（默认 5432，PG 客户端直接连 localhost:5432；
      # 如本地已占 5432，可用 FINV_PG_EXPOSE_PORT 改为其他端口）
      - "127.0.0.1:${FINV_PG_EXPOSE_PORT:-5432}:5432"
    volumes:
      # PG 数据目录映射到 Docker 宿主机文件系统（容器重建/删除不丢数据）
      # 默认：Deploy/pgdata（项目相对目录）；Windows 示例：
      #   FINV_PG_DATA_DIR=D:/Dev/Docker/HostFileSystem/FinvQuant/PostgreSQL
      # ⚠️ PG18+ 镜像数据目录变更：挂载点为 /var/lib/postgresql（单一挂载），
      #    实际数据在宿主目录下的 18/ 子目录；挂载 /var/lib/postgresql/data
      #    会被镜像判定为 unused mount 并拒绝启动。
      - ${FINV_PG_DATA_DIR:-./pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FINV_PG_USER:-finvquant} -d ${FINV_PG_DATABASE:-finvquant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: ${FINV_REDIS_CONTAINER_NAME:-fq-redis}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${FINV_REDIS_EXPOSE_PORT:-6380}:6379"
    volumes:
      - finvquant-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  # PG 数据已绑定挂载到宿主机目录（FINV_PG_DATA_DIR），不再需要命名卷
  finvquant-redisdata:
