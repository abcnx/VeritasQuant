# FinvQuant CI/CD：构建并推送 All-in-One 镜像到 GitHub Packages (GHCR)
#   - ghcr.io/acanx/finvquant（Go 服务端 16001 + 内嵌前端 16002，单镜像单进程）
#
# 触发：push 到 dev/main/FinvQuant、tag v*、PR、手动
# tag 规则：latest（dev/main/FinvQuant 推送）+ 版本 tag（v* 推送时使用 git tag）

name: FinvQuant CI/CD

on:
  push:
    branches: [dev, main, FinvQuant]
    tags: ["v*"]
  pull_request:
    branches: [dev, main, FinvQuant]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/acanx/finvquant

jobs:
  # ------------------------------------------------------------------
  # 1. Go 服务端构建与测试
  # ------------------------------------------------------------------
  build-server:
    name: Build Go server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache-dependency-path: go.sum

      - name: Prepare embedded web assets
        run: |
          # 构建前端产物供 embed（无 node 环境时用最小占位，测试不受影响）
          mkdir -p internal/webui/dist
          echo "{}" > internal/webui/dist/placeholder.txt || true

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -o /tmp/finvquant ./cmd/server

      - name: Go test
        run: go test ./... -count=1

  # ------------------------------------------------------------------
  # 2. 前端构建
  # ------------------------------------------------------------------
  build-web:
    name: Build Vue web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ------------------------------------------------------------------
  # 3. 构建并推送 All-in-One 镜像到 GHCR
  # ------------------------------------------------------------------
  docker:
    name: Build & push finvquant image (GHCR)
    needs: [build-server, build-web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=latest,${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push finvquant image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ------------------------------------------------------------------
  # 4. PR 验证：仅构建镜像不推送
  # ------------------------------------------------------------------
  docker-pr:
    name: Build finvquant image (PR validation)
    needs: [build-server, build-web]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build finvquant image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:pr-check
