# FinvQuant CI/CD：构建并推送 All-in-One 镜像到 GitHub Packages (GHCR)
#   - ghcr.io/acanx/finvquant（Go 服务端 16001 + 内嵌前端 16002，单镜像单进程）
#
# 触发：push 到 dev/main/FinvQuant、tag v*、PR、手动
# 全局版本：单一来源 = 项目根 VERSION 文件（同时用于后端 -ldflags、前端 package.json、镜像 tag）
# tag 规则：
#   - dev/main/FinvQuant 分支推送：latest + v{VERSION}-YYYYMMDDHHMM（Asia/Shanghai，如 v0.1.0-202608051901）
#   - v* tag 推送（main 发布）：latest + v{VERSION}（即 git tag 名，如 v0.1.0）
#   - 多平台构建：linux/amd64 + linux/arm64，另打平台专属 tag
#     （v{VERSION}[-YYYYMMDDHHMM]-linux-amd64 / -linux-arm64）

name: FinvQuantCICD

on:
  push:
    branches: [dev, main, FinvQuant]
    tags: ["v*"]
  pull_request:
    branches: [dev, main, FinvQuant]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/acanx/finvquant
  # 多平台构建（平台 tag 后缀据此生成，如 -linux-amd64 / -linux-arm64）
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ------------------------------------------------------------------
  # 1. Go 服务端构建与测试
  # ------------------------------------------------------------------
  build-server:
    name: BuildGoServer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache-dependency-path: go.sum

      - name: PrepareEmbeddedWebAssets
        run: |
          # 前端构建产物供 embed（无 node 环境时用最小占位，保证 SPA fallback 测试可运行）
          mkdir -p internal/webui/dist
          printf '<!doctype html><html><body><div id="app">placeholder</div></body></html>' > internal/webui/dist/index.html
          echo "{}" > internal/webui/dist/placeholder.txt || true

      - name: GoVet
        run: go vet ./...

      - name: GoBuild
        run: go build -o /tmp/finvquant ./cmd/server

      - name: GoTest
        run: go test ./... -count=1

  # ------------------------------------------------------------------
  # 2. 前端构建
  # ------------------------------------------------------------------
  build-web:
    name: BuildVueWeb
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          # 全局版本号注入前端 package.json（单一来源：项目根 VERSION）
          VERSION=$(cat ../VERSION)
          npm pkg set version="$VERSION"
          npm run build

  # ------------------------------------------------------------------
  # 3. 构建并推送 All-in-One 镜像到 GHCR
  # ------------------------------------------------------------------
  docker:
    name: BuildAndPushFinvQuantImage (GHCR)
    needs: [build-server, build-web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: ResolveImageTags
        id: tags
        run: |
          VERSION=$(cat VERSION)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # v* tag 推送（main 发布）：latest + v{VERSION}（git tag 名）
            BASE="${{ github.ref_name }}"
          else
            # 分支推送（dev/main/FinvQuant）：latest + v{VERSION}-YYYYMMDDHHMM（Asia/Shanghai）
            TS=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
            BASE="v${VERSION}-${TS}"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${BASE}" >> "$GITHUB_OUTPUT"

      - name: LoginToGHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SetupQEMU
        uses: docker/setup-qemu-action@v3

      - name: SetupDockerBuildx
        uses: docker/setup-buildx-action@v3

      - name: BuildAndPushFinvQuantImage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # 为每个平台单独打 tag（如 v0.1.0-202608051934-linux-amd64 / -linux-arm64），
      # 便于按平台拉取/区分构建产物
      - name: TagPerPlatformManifests
        run: |
          BASE="${{ steps.tags.outputs.base }}"
          for PLAT in ${{ env.PLATFORMS }}; do
            SUFFIX=${PLAT//\//-}
            docker buildx imagetools create \
              --platform "$PLAT" \
              --tag "${{ env.IMAGE }}:${BASE}-${SUFFIX}" \
              "${{ env.IMAGE }}:${BASE}"
          done

  # ------------------------------------------------------------------
  # 4. PR 验证：仅构建镜像不推送
  # ------------------------------------------------------------------
  docker-pr:
    name: BuildFinvQuantImage(PRValidation)
    needs: [build-server, build-web]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SetupDockerBuildx
        uses: docker/setup-buildx-action@v3

      - name: BuildFinvQuantImage(no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:pr-check
